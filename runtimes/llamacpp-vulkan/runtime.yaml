name: llamacpp-vulkan
servers:
  openai:
    protocol: http
    base-path: /v1

environment:
  # Add llama.cpp binaries and shared libraries.
  # The prebuilt upstream binaries use an $ORIGIN RUNPATH and the ggml dynamic
  # backend loader expects libggml-* backends beside the executables, hence
  # both live together in bin/.
  - PATH=$PATH:$SNAP_COMPONENTS/llamacpp-vulkan/bin
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-vulkan/bin
  # Add staged shared libraries (e.g. the Vulkan loader and ICD drivers)
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-vulkan/usr/lib/$ARCH_TRIPLET
  # Directory containing the Vulkan ICD manifest files
  - VULKAN_ICD_PATH=$SNAP_COMPONENTS/llamacpp-vulkan/usr/share/vulkan/icd.d

components:
  - llamacpp-vulkan
